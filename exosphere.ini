# 配置项: debugmode, 默认值: 1.
#  说明: 控制内核是否为调试模式。
#   禁用此项将导致 Atmosphere 无法正常工作。

# 配置项: debugmode_user, 默认值: 0.
#  说明: 控制用户态是否为调试模式。

# 配置项: disable_user_exception_handlers, 默认值: 0.
#  说明: 控制发生错误时是否执行用户异常处理器。
#  注意: 这将导致 atmosphere 无法正常处理错误。
#   禁用此功能的用户可能无法获得技术支持。
#   如果您不了解这是什么，请保持启用状态。

# 配置项: enable_user_pmu_access, 默认值: 0.
#  说明: 控制用户态是否能访问 PMU 寄存器。
#  注意: 目前尚不清楚这对官方代码有何影响。

# 配置项: blank_prodinfo_sysmmc, 默认值: 0.
#  说明: 控制是否在系统内存中清空 PRODINFO。
#   这将使系统看到虚拟的密钥和
#   序列号信息。
#  注意: 目前不确定这样做是否安全，因为数据可能
#   缓存在系统的其他地方。不建议使用此功能。

# 配置项: blank_prodinfo_emummc, 默认值: 0.
#  说明: 控制是否在虚拟内存中清空 PRODINFO。
#  注意: 目前不确定这样做是否安全，因为数据可能
#   缓存在系统的其他地方。不建议使用此功能。

# 配置项: allow_writing_to_cal_sysmmc, 默认值: 0.
#  说明: 控制自制程序是否能在系统内存中写入 PRODINFO。
#  注意: 强烈不建议在没有安全备份的情况下使用此设置。
#    启用此选项将使 Atmosphere 确保将校准数据的安全备份
#    存储在未使用的 mmc 空间中，并加密以防止被检测。
#    此备份可用于在紧急情况下防止不可恢复的编辑。

# 配置项: log_port, 默认值: 0.
#  说明: 控制 exosphere 将使用哪个 uart 端口进行日志记录。
#  注意: 0 = UART-A, 1 = UART-B, 2 = UART-C, 3 = UART-D

# 配置项: log_baud_rate, 默认值: 115200
#  说明: 控制 exosphere 日志记录的波特率。
#  注意: 0 被视为等同于 115200。

# 配置项: log_inverted, 默认值: 0.
#  说明: 控制日志 uart 端口是否反转。

[exosphere]
debugmode=1                             ; 内核调试模式 (1=启用, 0=禁用) - 必须保持启用
debugmode_user=0                        ; 用户态调试模式 (1=启用, 0=禁用)
disable_user_exception_handlers=0       ; 禁用用户异常处理器 (1=禁用, 0=启用) - 建议保持0
enable_user_pmu_access=0                ; 允许用户态访问 PMU 寄存器 (1=允许, 0=禁止)
blank_prodinfo_sysmmc=1                 ; 真实系统是否屏蔽序列号
blank_prodinfo_emummc=1                 ; 虚拟系统是否屏蔽序列号
allow_writing_to_cal_sysmmc=0          ; 允许向真实系统写入盗版程序 不要开！！！
log_port=0                              ; 日志端口 (0=UART-A, 1=UART-B, 2=UART-C, 3=UART-D)
log_baud_rate=115200                    ; 日志波特率 (0 或 115200)
log_inverted=0                          ; 日志端口反转 (1=反转, 0=正常)
