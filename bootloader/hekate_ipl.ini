[config]
autoboot=1
autoboot_list=0
bootwait=3
backlight=100
noticker=0
autohosoff=1
autonogc=1
updater2p=0
bootprotect=0





[虚拟系统]
; 设置package3路径
; hekate会从中提取kips, exosphere, warmboot, mesophere
pkg3=atmosphere/package3
; 强制使用 emuMMC=3
emummcforce=1
; 设置kip路径
kip1=atmosphere/kips/*
; 设置hekate开机图
logopath=bootloader/bootlogo.bmp
; hekate 启动项的图标
icon=bootloader/res/icon_EMU.bmp
; 启动大气层虚拟系统
id=Atm-Emu

[正版系统]
pkg3=atmosphere/package3
; 启动的时候屏幕掉emuMMC=here, warmboot, mesophere
emummc_force_disable=1
; 启动正版系统引导=uMMC
stock=1
icon=bootloader/res/icon_OFW.bmp
; 启动官方正版系统
id=OFW-SYS


[虚拟安全模式]
; 不加载KIP让超频功能失效
pkg3=atmosphere/package3
emummcforce=1
logopath=bootloader/bootlogo.bmp
icon=bootloader/res/icon_safe_EMU.bmp