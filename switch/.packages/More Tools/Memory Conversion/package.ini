[*内存转换]
;mode=option
json_source '[{"name":"4G内存状态 - 默认", "label":"4G内存状态", "path":"./Data/4G.zip"}, {"name":"8G内存状态 - 非硬改8G勿动", "label":"8G内存状态", "path":"./Data/8G.zip"}]' name
unzip  {json_source(*,path)} /
set-footer '{json_source(*,label)}'

ini_file '/switch/.packages/More Tools/Memory Conversion/config.ini'
exec {ini_file(*内存转换,footer)}

[重启生效]
[立即重启]
reboot boot '虚拟系统'

