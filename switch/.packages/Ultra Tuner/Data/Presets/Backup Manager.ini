'最高频率'= '{slice({hex_to_decimal({hex_to_rhex({ini_file(Backup,ramMHzE)})})},0,4)} MHz'
json_file './Boot Jsons/RAM Vdd.json'
'Vdd2 电压'= '{json_file(0,{ini_file(Backup,ramVDD2)})} mV'
json_file './Boot Jsons/RAM DVB.json'
'EMC DVB 表'= {json_file(0,{ini_file(Backup,DVB)})}

