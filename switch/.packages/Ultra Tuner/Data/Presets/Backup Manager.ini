;color=#FFAA00
;show_widget=true


[@查看备份]


[Header]
;mode=table
;background=false
;header_indent=true
;polling=true
ini_file '/switch/.packages/Ultra Tuner/config.ini'
'已选择:'= '{slice({ini_file(Backup,Current)},27,100)}'


[Gap]
;mode=table
;background=false
;gap=0

[*选择备份]
;grouping=split
;mini=true
file_source /atmosphere/kips/.bak/*.ini
set-ini-val '/switch/.packages/Ultra Tuner/config.ini' Backup Current '{file_source}'
ini_file '/switch/.packages/Ultra Tuner/config.ini'
back



[Gap]
;mode=table
;background=false
;gap=5

[Info]
;mode=table
;background=false
;end_gap=5
;gap=17
'备份位置'= '/atmosphere/kips/.bak/'

[*重命名备份:]
;mini=true
list_file_source './backup names.txt'

ini_file '/switch/.packages/Ultra Tuner/config.ini'
mv '{ini_file(Backup,Current)}' '/atmosphere/kips/.bak/Backup {list_file_source(*)}.ini'
set-ini-val '/switch/.packages/Ultra Tuner/config.ini' Backup Current 'sdmc:/atmosphere/kips/.bak/Backup {list_file_source(*)}.ini'


[*恢复备份]
;mini=true
;grouping=split
file_source /atmosphere/kips/.bak/*.ini
file_source /atmosphere/kips/.bakTK/*.ini

ini_file '{file_source}'
cp {file_source} /atmosphere/kips/.bak/Temp.ini
set-ini-val '/switch/.packages/Ultra Tuner/config.ini' Backup Current '{file_source}'


json '[{"null":"restore", "Meha-2.0.0rc6²":"converter-old", "Meha-2.0.0rc6²-S":"converter-old", "B3711-Switchcraft-1.1.1":"converter-1.3.6", "B3711-1.3.3":"converter-1.3.6", "B3711-1.3.6":"converter-1.3.6", "SC-1.4.0":"converter-1.4.0", "SC-1.4.4":"converter-1.4.4", "SC-1.5.1":"converter-1.5.1", "SC-1.6.0":"converter-1.6.0", "SC-1.6.4":"converter-1.6.4", "SC-1.6.8":"restore"}]'

set-ini-val '/switch/.packages/Ultra Tuner/config.ini' Backup Version '{json(0,{ini_file(Backup,Version)})}'
ini_file '/switch/.packages/Ultra Tuner/config.ini'
exec '{ini_file(Backup,Version)}'
exec restore

del /atmosphere/kips/.bak/Temp.ini





[*删除备份]
;mini=true
;grouping=split
file_source /atmosphere/kips/.bak/*.ini
file_source /atmosphere/kips/.bakTK/*.ini

del {file_source}



[*覆盖备份]
;mini=true
file_source /atmosphere/kips/.bak/*.ini

set-ini-val '/switch/.packages/Ultra Tuner/config.ini' Backup Current '{file_source}'

exec backup

mv /atmosphere/kips/.bak/Current.ini '{file_source}'



[创建备份]
;mini=true
set-ini-val '/switch/.packages/Ultra Tuner/config.ini' Backup Current 'sdmc:/atmosphere/kips/.bak/Backup {timestamp("%y.%m.%d [%H-%M]")}.ini'

exec backup

ini_file '/switch/.packages/Ultra Tuner/config.ini'
mv /atmosphere/kips/.bak/Current.ini '{ini_file(Backup,Current)}'





[Gap]
;mode=table
;background=false
;gap=106

[Header]
;mode=table
;header_indent=true
;background=false
;info_text_color=#AAAAAA
'RAM' = '已选备份'


[Info]
;mode=table
;polling=true
;spacing=0
;gap=0
ini_file '/switch/.packages/Ultra Tuner/config.ini'
ini_file '{ini_file(Backup,Current)}'


mariko:
json_file './Boot Jsons/RAM DRAM.json'
'时序状态'= {json_file(0,{ini_file(Backup,DRAM)})}
'最高频率'= '{slice({hex_to_decimal({hex_to_rhex({ini_file(Backup,ramMHzM)})})},0,4)} MHz'
json_file './Boot Jsons/RAM DVB.json'
'EMC DVB 表'= {json_file(0,{ini_file(Backup,DVB)})}
json_file './Boot Jsons/RAM Vdd.json'
'Vdd2/Vddq 电压'= '{json_file(0,{ini_file(Backup,ramVDD2)})}/{json_file(0,{ini_file(Backup,ramVDDQ)})} mV'

json_file './Boot Jsons/RAM Timings.json'
'内存时序'='({json_file(0,{ini_file(Backup,T1)})}-{json_file(0,{ini_file(Backup,T2)})}-{json_file(0,{ini_file(Backup,T3)})})-{json_file(0,{ini_file(Backup,T4)})}-{json_file(0,{ini_file(Backup,T5)})}-{json_file(0,{ini_file(Backup,T6)})}-{json_file(0,{ini_file(Backup,T7)})}-{json_file(0,{ini_file(Backup,T8)})}'

